# 一次性诊断：AE UA × IP 哈希拆解（用后即删，含 scripts/ae-ua-breakdown.py）
name: AE 诊断（一次性）

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ua-breakdown:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: UA breakdown
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AE_ACCOUNT_ID: ${{ vars.AE_ACCOUNT_ID }}
        run: python3 scripts/ae-ua-breakdown.py

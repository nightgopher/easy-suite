name: Deploy (GitHub Pages + dl worker)

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 每小时拉取 AE 快照（stats-snapshot job 提交后 push main 触发 Pages 重新部署）
    - cron: '23 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  dl-worker:
    # dl 分发层（worker/）自动部署：仅在 worker 相关文件有变更时执行，
    # 使用与 Pages 部署相同的 push main 触发，消除唯一的手动部署环节。
    # 前置：repo secret CLOUDFLARE_API_TOKEN（Workers Scripts Write 权限）。
    runs-on: ubuntu-latest
    steps:
      - name: Detect worker changes
        id: changes
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('changed', 'true');
              return;
            }
            const compare = await github.rest.repos.compareCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: context.payload.before,
              head: context.payload.after,
            });
            const touched = compare.data.files.some(f => f.filename.startsWith('worker/'));
            core.setOutput('changed', String(touched));
      - name: Checkout
        if: steps.changes.outputs.changed == 'true'
        uses: actions/checkout@v4
      - name: Setup Node
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install wrangler
        if: steps.changes.outputs.changed == 'true'
        run: npm install -g wrangler@latest
      - name: Typecheck & deploy dl worker
        if: steps.changes.outputs.changed == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm install --no-fund --no-audit
          npm run typecheck
          npm run deploy
          # deploy 的 bindings 集合来自 wrangler.jsonc，不含 secrets——
          # AE_QUERY_TOKEN（看板查询凭据）必须显式 put：2026-11-21 踩坑，
          # CI 首次自动部署抹掉了此前经 API 设置的 secret，/stats.json 降级 503
          echo "$CLOUDFLARE_API_TOKEN" | npx wrangler secret put AE_QUERY_TOKEN

  stats-snapshot:
    # 每小时把 AE 聚合数据快照进仓库（public/stats-snapshot.json）——
    # 官网 /stats/ 在 dl 分发层不可达（大陆直连 Cloudflare 不稳）时回退同源快照。
    # 仅定时/手动触发；push main 的常规部署不需要。
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # 提交快照需要写权限（顶层是 read；job 级覆盖）
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate snapshot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AE_ACCOUNT_ID: ${{ vars.AE_ACCOUNT_ID }}
        run: python3 scripts/stats-snapshot.py
      - name: Commit snapshot if changed
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          if [[ -n "$(git status --porcelain public/stats-snapshot.json)" ]]; then
            git add public/stats-snapshot.json
            git commit -m "chore: stats 快照更新（scheduled）"
            git push
          else
            echo "快照无变化，跳过提交"
          fi
